name: Release - GHCR and Render

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chochi1250/promotrack-api

jobs:
  release:
    name: Test, Publish, Release and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate semver tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' must match vX.Y.Z"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B clean test

      - name: Package application
        run: ./mvnw -B clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=true
            type=sha,prefix=sha-,format=short

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "Docker images published to GHCR:"
            echo ""
            echo "$IMAGE_TAGS"
          } > release-notes.md

          gh release create "$TAG_NAME" \
            --title "PromoTrack API $TAG_NAME" \
            --notes-file release-notes.md

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_IMAGE_URL: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing required secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          ENCODED_IMAGE_URL="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RENDER_IMAGE_URL"], safe=""))')"

          SEPARATOR="?"
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]]; then
            SEPARATOR="&"
          fi

          echo "Triggering Render deploy for image: $RENDER_IMAGE_URL"
          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}${SEPARATOR}imgURL=${ENCODED_IMAGE_URL}"

      - name: Check New Relic Change Tracking config
        id: newrelic_config
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_DEPLOYMENT_ENTITY_GUID: ${{ secrets.NEW_RELIC_DEPLOYMENT_ENTITY_GUID }}
        run: |
          if [ -n "$NEW_RELIC_API_KEY" ] && [ -n "$NEW_RELIC_DEPLOYMENT_ENTITY_GUID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "New Relic Change Tracking skipped: missing NEW_RELIC_API_KEY or NEW_RELIC_DEPLOYMENT_ENTITY_GUID."
          fi

      - name: Record New Relic deploy triggered change event
        if: ${{ steps.newrelic_config.outputs.enabled == 'true' }}
        uses: newrelic/deployment-marker-action@v2.6.2
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          commandType: changeTrackingCreateEvent
          entitySearch: "id='${{ secrets.NEW_RELIC_DEPLOYMENT_ENTITY_GUID }}'"
          version: ${{ github.ref_name }}
          category: Deployment
          type: Basic
          commit: ${{ github.sha }}
          deeplink: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: "PromoTrack API ${{ github.ref_name }} deploy sent to Render by GitHub Actions."
          shortDescription: "PromoTrack API ${{ github.ref_name }} deploy triggered on Render"
          user: ${{ github.actor }}
          groupId: promotrack-api-${{ github.ref_name }}
          customAttributes: '{environment: "render", registry: "ghcr", image: "ghcr.io/chochi1250/promotrack-api:${{ github.ref_name }}"}'
