name: Manual Deploy - Render

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chochi1250/promotrack-api

jobs:
  deploy:
    name: Test, Publish and Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: render-manual-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B clean test

      - name: Package application
        run: ./mvnw -B clean package -DskipTests

      - name: Set manual image tag
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=render-manual-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "url=${REGISTRY}/${IMAGE_NAME}:render-manual-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image.outputs.tag }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_IMAGE_URL: ${{ steps.image.outputs.url }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing required secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          ENCODED_IMAGE_URL="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RENDER_IMAGE_URL"], safe=""))')"

          SEPARATOR="?"
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]]; then
            SEPARATOR="&"
          fi

          echo "Triggering Render deploy for image: $RENDER_IMAGE_URL"
          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}${SEPARATOR}imgURL=${ENCODED_IMAGE_URL}"
